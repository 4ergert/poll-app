<section class="vote_content">

  <header class="vote_header">
    <img src="/assets/img/poll-app-dark.png" alt="Poll App Dark Logo" width="119px" height="49px">

    <poll-app-button (click)="dialogService.openCreateSurveyDialog()">
      Create survey
    </poll-app-button>
  </header>




  @if (survey(); as selectedSurvey) {
  <h1>{{ selectedSurvey.name }}</h1>
  } @else {
  <p>Survey is loading or could not be found.</p>
  }

</section>
