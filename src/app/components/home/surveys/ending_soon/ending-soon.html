<section class="ending_soon">
  <p>Ending soon surveys</p>
  
  <section id="genEndingSurvey" class="ending_survey">
    @for (survey of endingSoonSurveys(); track $index) {
      <ending-survey [routerLink]="['/vote', survey.id]">
        <div class="ending_survey__header">
          <p class="ending_survey__category">{{ survey.category }}</p>
          <h4>{{ survey.name }}</h4>
        </div>
        <p class="ending_survey__ends_in">Ends in {{ getEndsInDays(survey.date) }} days</p>
      </ending-survey>
    }

  </section>
  
</section>
