<section class="overview">
  <div class="overview_header">
    <div class="overview_header_buttons">
      <overview-button>Active surveys</overview-button>
      <overview-button>Past surveys</overview-button>
    </div>
    <dropdown-menu (categorySelected)="selectCategory($event)"></dropdown-menu>
  </div>
  <section id="surveysOverview">
    @for (survey of displayedSurveys(); track survey.id) {
      <survey-card class="survey_card" [routerLink]="['/vote', survey.id]">
        <div>
          <p class="survey_card__category"> {{ survey.category }} </p>
          <h5 class="survey_card__h5"> {{ survey.name }} </h5>
        </div>
        <p class="survey_card__ends-in">Ends in {{ getEndsInDays(survey.date) }} days</p>
      </survey-card>
    }
  </section>
</section>
