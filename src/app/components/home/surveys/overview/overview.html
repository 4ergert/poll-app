<section class="overview">
  <div class="overview_header">
    <div class="overview_header_buttons">
      <button>Active servey</button>
      <button>Past servey</button>
    </div>
    <dropdown-menu></dropdown-menu>
  </div>
  <section id="surveysOverview">
    @for (survey of allSurveys(); track $index) {
      <survey-card>
        <p> {{ survey.category }} </p>
        <h5> {{ survey.name }} </h5>
        <p>Ends in {{ getEndsInDays(survey.date) }} days</p>
      </survey-card>
    }
  </section>
</section>
