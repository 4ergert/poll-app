<div class="dropdown-menu">
  <button
    type="button"
    id="overviewSortByCategories"
    [class.is-open]="isOpen"
    [class.has-selection]="selectedCategory"
    aria-haspopup="listbox"
    aria-controls="survey-category-options"
    [attr.aria-expanded]="isOpen"
    (click)="toggleMenu()"
    (keydown)="onTriggerKeyDown($event)">
    {{ selectedCategoryLabel }}
  </button>

  @if (isOpen) {
    <ul id="survey-category-options" class="category-options" role="listbox" aria-label="Sort by categories">
      @for (category of categories; track category.value; let index = $index) {
        <li
          #categoryOption
          role="option"
          tabindex="-1"
          [attr.aria-selected]="selectedCategory === category.value"
          (click)="selectCategory(category)"
          (keydown)="onOptionKeyDown($event, index)">
          {{ category.label }}
        </li>
      }
    </ul>
  }
</div>
