<main>
  <app-header></app-header>
  <app-hero class="hero" (createSurvey)="isCreateSurveyDialogOpen = true"></app-hero>
  <app-surveys></app-surveys>
</main>

@if (isCreateSurveyDialogOpen) {
  <div class="dialog_overlay" (click)="isCreateSurveyDialogOpen = false">
  <app-create-new-survey (close)="isCreateSurveyDialogOpen = false" (click)="$event.stopPropagation()"></app-create-new-survey>
  </div>
}
