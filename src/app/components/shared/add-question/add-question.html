<section class="question" [formGroup]="formGroup()">

  <div class="answer_and_add_next_question">
    <label for="question">{{ questionNumber }}. Question</label>
    <p class="input_with_delete">
      <input id="question" type="text" formControlName="question" name="question-{{ questionNumber }}">
      <trashcan />
    </p>

    <label for="answer">Answer</label>
    <div class="question_and_answer">
      @for (item of answerNumbers.slice(0, answersCount ); track $index) {
      <p class="input_with_delete">{{ item }}. <input id="answer-{{ $index }}" type="text" formControlName="answer" name="answer-{{ $index }}">
        <trashcan />
      </p>
      }
    </div>
    <add-answer-button (add)="addAnswer()"></add-answer-button>
  </div>
  
  <div class="add_next_question">
    <sec-button>
      Add next question
      <img src="assets/icons/add_icon.png" alt="Add Icon">
    </sec-button>
  </div>

</section>
