<section class="question_editor" [formGroup]="questionForm()">
  <div class="question_fields">
    <div class="question_header">
      <label for="question{{ questionNumber() }}" [attr.aria-label]="questionNumber() + '. Question'">
        {{ questionNumber() }}. Question
        <trashcan
          class="trashcan_in_question_label"
          [ariaLabel]="questionForm().controls.question.value?.trim() ? 'Delete content' : 'Delete question'"
          [tooltip]="questionForm().controls.question.value?.trim() ? 'Delete content' : 'Delete question'"
          (click)="delete('question')" />
      </label>
    </div>
    <p class="input_with_delete">
      <input
        id="question{{ questionNumber() }}"
        type="text"
        formControlName="question"
        maxlength="200"
        required
        [class.required_input]="questionForm().controls.question.invalid && questionForm().controls.question.touched"
        [placeholder]="questionForm().controls.question.invalid && questionForm().controls.question.touched ? 'This field is required.' : ''"
        [attr.aria-invalid]="questionForm().controls.question.invalid && questionForm().controls.question.touched"
      />
      <trashcan
        class="trashcan_next_to_question_input"
        [ariaLabel]="questionForm().controls.question.value?.trim() ? 'Delete content' : 'Delete question'"
        [tooltip]="questionForm().controls.question.value?.trim() ? 'Delete content' : 'Delete question'"
        (click)="delete('question')" />
    </p>
    @if (questionForm().controls.question.value?.length === 200) {
    <p class="validation_message">max. of 200 characters</p>
    }
    <div class="answer_header">
      <label for="answer">Answer</label>
      <div class="multiple_choice">
        <input id="multipleChoice{{ questionNumber() }}" type="checkbox" formControlName="multipleChoice" />
        <label for="multipleChoice{{ questionNumber() }}">Allow multiple answers.</label>
      </div>
    </div>
    <div class="answers" formArrayName="answers">
      @for (answer of answers.controls; track answer) {
      <div class="answer_field">
        <p class="input_with_delete answer_input_with_delete">
          {{ getAnswerLabel($index) }}.
          <input
            id="answer{{ questionNumber() }}Index{{ $index }}"
            type="text"
            [formControlName]="$index"
            maxlength="200"
            required
            [class.required_input]="answer.invalid && answer.touched"
            [placeholder]="answer.invalid && answer.touched ? 'This field is required.' : ''"
            [attr.aria-invalid]="answer.invalid && answer.touched"
          />
          <trashcan [ariaLabel]="answer.value?.trim() ? 'Delete content' : 'Delete row'"
            [tooltip]="answer.value?.trim() ? 'Delete content' : 'Delete row'" (click)="delete('answers', $index)" />
        </p>
        @if (answer.value?.length === 200) {
        <p class="validation_message">max. of 200 characters</p>
        }
      </div>
      }
    </div>
    <add-answer-button (add)="addAnswer()"></add-answer-button>
  </div>
</section>
